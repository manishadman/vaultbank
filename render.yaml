# One-click: https://render.com/deploy?repo=https://github.com/manishadman/vaultbank
# The web service and the database share one site so the refresh cookie stays first-party.
services:
  - type: web
    name: vaultbank
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate --schema backend/prisma/schema.prisma && npm run build
    preDeployCommand: npm run db:migrate -w backend && npm run db:seed -w backend
    startCommand: npm start -w backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_ALLOW
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: vaultbank-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: vaultbank-db
    plan: free
    databaseName: vaultbank
    user: vaultbank
